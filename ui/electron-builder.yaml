appId: net.coclaw.im
productName: CoClaw
# 壳子版本独立于 @coclaw/ui 的 npm 版本
# 仅在壳子自身需要更新时（新增权限/插件/原生能力）才递增
extraMetadata:
  version: "1.0.0"
copyright: "Copyright 2026 Chengdu Gongyan Technology Co., Ltd."

directories:
  output: dist-electron
  buildResources: build-resources

# 远程加载模式：仅打包 electron/ 目录和必要资源
# icon.ico / icon.icns / icon.png 都需要显式声明：
#   - electron-builder 依据 win.icon/mac.icon 注入到 .exe / .app 自身（installer 阶段）
#   - 但 BrowserWindow.icon 在运行时通过 path.join 直接读 asar 内文件，
#     未声明则会读到空 nativeImage（窗口栏 fallback 到 .exe 默认图标）
files:
  - electron/**/*
  - build-resources/icon.png
  - build-resources/icon.ico
  - build-resources/icon.icns
  - build-resources/tray-icon*.png
  - package.json
  # 桌面壳远程加载线上前端（生产指向 https://im.coclaw.net，不加载本地 dist），
  # 故 ui 整棵生产依赖树（vue/@nuxt/ui/capacitor/... + 构建工具 tailwind/esbuild/rollup/sass
  # 及其各平台原生变体）运行时零引用。electron-builder 默认自动收集全部生产依赖进 app.asar，
  # 这里先整棵排除，再仅重新纳入桌面主进程（electron/*.js）真正 import 的运行时闭环。
  #   - 白名单 = 5 个 electron-* 直接依赖 + 其传递闭环，共 63 包。此清单手工维护，与根
  #     THIRD-PARTY-NOTICES.md 的 electron surface 集合是相互独立的副本、无自动对账——
  #     升级壳子依赖后两处须人工同步核对，存在静默漂移风险
  #   - 收紧后跨平台原生变体 / 构建工具 / peer 超集包一次性不再出货
  #   - electron 本体不在此列：它是运行时、由 electron-builder 单独提供，从不打进 asar
  #   - 重新纳入 glob 锚定顶层 node_modules/<name>/（不加 **/ 前缀）：electron-builder 把
  #     闭环全部 hoist 到顶层，锚定即只留壳子用的那份；构建工具（如 @capacitor/cli）为版本冲突
  #     而嵌套的同名副本（.../node_modules/fs-extra 等）不匹配、随排除留在外面
  - "!**/node_modules/**"
  - "node_modules/ajv/**"
  - "node_modules/ajv-formats/**"
  - "node_modules/ansi-regex/**"
  - "node_modules/ansi-styles/**"
  - "node_modules/argparse/**"
  - "node_modules/atomically/**"
  - "node_modules/builder-util-runtime/**"
  - "node_modules/cli-truncate/**"
  - "node_modules/conf/**"
  - "node_modules/debounce-fn/**"
  - "node_modules/debug/**"
  - "node_modules/dot-prop/**"
  - "node_modules/electron-context-menu/**"
  - "node_modules/electron-dl/**"
  - "node_modules/electron-is-dev/**"
  - "node_modules/electron-log/**"
  - "node_modules/electron-store/**"
  - "node_modules/electron-updater/**"
  - "node_modules/electron-window-state/**"
  - "node_modules/emoji-regex/**"
  - "node_modules/env-paths/**"
  - "node_modules/escape-goat/**"
  - "node_modules/escape-string-regexp/**"
  - "node_modules/ext-list/**"
  - "node_modules/ext-name/**"
  - "node_modules/fast-deep-equal/**"
  - "node_modules/fast-uri/**"
  - "node_modules/fs-extra/**"
  - "node_modules/get-east-asian-width/**"
  - "node_modules/graceful-fs/**"
  - "node_modules/is-fullwidth-code-point/**"
  - "node_modules/is-plain-obj/**"
  - "node_modules/js-yaml/**"
  - "node_modules/json-schema-traverse/**"
  - "node_modules/json-schema-typed/**"
  - "node_modules/jsonfile/**"
  - "node_modules/lazy-val/**"
  - "node_modules/lodash.escaperegexp/**"
  - "node_modules/lodash.isequal/**"
  - "node_modules/mime-db/**"
  - "node_modules/mimic-function/**"
  - "node_modules/minimist/**"
  - "node_modules/mkdirp/**"
  - "node_modules/ms/**"
  - "node_modules/path-exists/**"
  - "node_modules/pupa/**"
  - "node_modules/require-from-string/**"
  - "node_modules/sax/**"
  - "node_modules/semver/**"
  - "node_modules/slice-ansi/**"
  - "node_modules/sort-keys/**"
  - "node_modules/sort-keys-length/**"
  - "node_modules/string-width/**"
  - "node_modules/strip-ansi/**"
  - "node_modules/stubborn-fs/**"
  - "node_modules/stubborn-utils/**"
  - "node_modules/tagged-tag/**"
  - "node_modules/tiny-typed-emitter/**"
  - "node_modules/type-fest/**"
  - "node_modules/uint8array-extras/**"
  - "node_modules/universalify/**"
  - "node_modules/unused-filename/**"
  - "node_modules/when-exit/**"

asar: true

# Deep Link 协议注册（coclaw://）：
#   - macOS：electron-builder 据此向打包 .app 的 Info.plist 注入 CFBundleURLTypes
#     （LaunchServices 只认它；运行时 setAsDefaultProtocolClient 无法为已打包 app 注册）。
#   - Windows：NSIS 不消费本字段；协议靠运行时 setAsDefaultProtocolClient 首次启动写
#     HKCU 注册（electron/deep-link.js），首启后即生效。“安装即注册”（首启前的冷链接）
#     需自定义 NSIS 脚本，见 ui/TODO.md。
protocols:
  - name: CoClaw Deep Link
    schemes:
      - coclaw

# 自动更新源：走 CoClaw 自己的 CDN，规避 GitHub Releases 的国内访问不稳定。
# Win / Mac 产物分别推送到 /releases/win/ 和 /releases/mac/，语义更清晰。
# 发布流程：build 后把 dist-electron/ 下对应平台的 latest*.yml + 安装包 + blockmap
# rsync 到 deploy/static/releases/<平台>/。

# ---- Windows ----
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build-resources/icon.ico
  # 代码签名（占位）：设置 CSC_LINK（.pfx/.p12 路径或其 base64）+ CSC_KEY_PASSWORD
  # 环境变量即自动签名；未设置时产出未签名安装包（会触发 SmartScreen 警告）。
  # 硬件令牌 / Azure Trusted Signing 等高级场景在此用 signtoolOptions 配置：
  # signtoolOptions:
  #   sign: ./build-resources/win-sign.cjs
  publish:
    - provider: generic
      url: https://im.coclaw.net/releases/win/

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  createDesktopShortcut: true
  shortcutName: CoClaw
  artifactName: coclaw-setup-${version}.${ext}
  installerLanguages:
    - zh_CN
    - en_US

portable:
  artifactName: coclaw-${version}.${ext}

# ---- macOS ----
mac:
  target:
    - target: dmg
      arch: [universal]
    # zip 是 electron-updater 在 macOS 上应用更新所必需的产物（dmg 不参与差量更新）；
    # 缺它则自动更新会抛 ERR_UPDATER_ZIP_FILE_NOT_FOUND。
    - target: zip
      arch: [universal]
  icon: build-resources/icon.icns
  category: public.app-category.social-networking
  darkModeSupport: true
  minimumSystemVersion: "12.0"
  hardenedRuntime: true
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.inherit.plist
  # 公证：electron-builder 内置 notarytool，凭据从环境变量读取（APPLE_ID +
  # APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID，或 APPLE_API_KEY 三件套；见 ../.env.example）。
  # 未配凭据时自动静默跳过、未签名(.app 无 Developer ID)时也不公证 —— 构建仍成功；
  # 正式分发须配齐，否则其它 Mac 的 Gatekeeper 会拦截下载到的 .app。
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: "CoClaw 需要使用麦克风来录制语音消息"
    NSCameraUsageDescription: "CoClaw 需要使用摄像头拍摄图片用于对话"
    NSScreenCaptureUsageDescription: "CoClaw 需要屏幕录制权限来支持截图功能"
  publish:
    - provider: generic
      url: https://im.coclaw.net/releases/mac/

dmg:
  window:
    width: 540
    height: 380
