services:
  mysql:
    container_name: coclaw-mysql
    # 默认变体（Oracle Linux 底座）是多架构镜像，含原生 arm64，
    # 让本地开发在 Apple Silicon 上免 x86 模拟直接起；mysqld 版本不变（8.0.36）。
    # 生产 compose.yaml 仍用 -bookworm（x86 部署不受影响），如需对齐再单独切换。
    image: mysql:8.0.36
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower_case_table_names=1
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: coclaw_root_2026
      MYSQL_DATABASE: coclaw
      MYSQL_USER: coclaw
      MYSQL_PASSWORD: coclaw_db_2026
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - coclaw_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # TURN/STUN 服务（WebRTC 中继）
  # 本地开发用，host 网络模式让 coturn 直接使用 WSL2/主机网络栈，
  # 无需逐个映射 relay 端口。
  # listening-ip / relay-ip 钉死 127.0.0.1：避免主机 IP 漂移（切网线/WiFi、
  # WSL2 重启）导致 coturn 尝试 bind 失效接口 relay 端口失败。
  coturn:
    container_name: coclaw-coturn
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command: >-
      turnserver
      --listening-port=3478
      --listening-ip=127.0.0.1
      --relay-ip=127.0.0.1
      --external-ip=127.0.0.1
      --realm=localhost
      --use-auth-secret
      --static-auth-secret=dev-secret-placeholder
      --min-port=50000
      --max-port=50100
      --fingerprint
      --no-cli
      --verbose

volumes:
  coclaw_mysql_data:
    name: coclaw_mysql_data
